volumes:
  postgres_data:
  redis_data:

services:
  app:
    container_name: app-projeto-extensao-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@postgresql:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3333:3333"
    command:
      [
        "sh",
        "-c",
        "pnpm prisma:generate && pnpm prisma:migrate && pnpm prisma:seed && pnpm start:dev",
      ]
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    container_name: db-projeto-extensao
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
    volumes:
      - postgres_data:/bitnami/postgresql
      - ./.docker/test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRESQL_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: cache-projeto-extensao
    image: bitnami/redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data:/bitnami/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
